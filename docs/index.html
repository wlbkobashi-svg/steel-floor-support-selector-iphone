<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="KIRII GTフロアー／GTダイレクトの支持台・ボルト組を高さから選定">
  <meta property="og:title" content="鋼製床 支持台・ボルト組 かんたん選定">
  <meta property="og:description" content="高さを入力して、標準組合せをすぐ確認。">
  <meta property="og:image" content="opengraph-image.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=5">
  <title>鋼製床 支持台・ボルト組選定</title>
</head>
<body>
<main>
  <header class="hero"><div class="eyebrow">KIRII STEEL FLOOR</div><h1>支持台・ボルト組<br>かんたん選定</h1><p>高さを入力して、標準組合せをすぐ確認。</p><span class="version">独立アプリ版</span></header>
  <section class="card form-card" aria-label="選定条件">
    <label>現場名（任意）<input id="site" placeholder="例：○○市体育館"></label>
    <label>床タイプ<select id="floor"><option value="general">GTフロアー（一般体育館）</option><option value="kendo">GTフロアー（剣道場）</option><option value="judo">GTフロアー（柔・剣道場）</option><option value="direct">GTダイレクト</option></select></label>
    <fieldset><legend>入力基準</legend><div class="segmented"><button type="button" id="finishBasis" class="active">仕上高</button><button type="button" id="joistBasis">根太天端</button></div></fieldset>
    <div class="row"><label>最小高さ<input id="min" inputmode="decimal" type="number" value="595"><span>mm</span></label><label>最大高さ<input id="max" inputmode="decimal" type="number" value="602"><span>mm</span></label></div>
    <div class="thickness" id="thickness"><p>仕上・下地厚（控除）</p><div class="row three"><label><span class="field-name">仕上</span><span class="input-unit"><input id="finish" inputmode="decimal" type="number" value="18"><span>mm</span></span></label><label><span class="field-name">下地1</span><span class="input-unit"><input id="under1" inputmode="decimal" type="number" value="15"><span>mm</span></span></label><label><span class="field-name">下地2</span><span class="input-unit"><input id="under2" inputmode="decimal" type="number" value="0"><span>mm</span></span></label></div><div class="formula">根太天端：<strong id="targetPreview">562〜569 mm</strong></div></div>
    <button class="primary" id="calculate" type="button">この条件で選定</button>
  </section>
  <section id="results" class="card results" aria-live="polite"><div class="section-head"><div><span>SELECTION</span><h2>選定結果</h2></div><button class="share hidden" id="share">画像で保存・共有</button></div><div class="empty" id="resultBody">条件を入力して「この条件で選定」を押してください。</div><p class="notice" id="notice"></p></section>
  <footer><p>標準表：STEEL FLOOR Ver.202602</p><p>計算はすべて端末内で行われ、ChatGPT・外部APIへ送信されません。</p><p>最終決定前に最新カタログ・現場条件をご確認ください。</p></footer>
</main>
<script src="app.js" defer></script>
</body>
</html>
